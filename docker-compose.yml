# 跨境电商客服 AI 实训智能体 —— 生产部署（db + api + web）
# 使用：cp .env.example .env（改密钥）→ docker compose up -d --build
# 固定项目名：避免中文目录名导致 compose project name 为空
name: cecs

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cecs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cecs_dev_2026}
      POSTGRES_DB: cecs
    volumes:
      - cecs_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cecs -d cecs"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        ALPINE_MIRROR: ${ALPINE_MIRROR:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # 定时备份的“每天几点”按北京时间（镜像里也设了，这里写明）
      TZ: Asia/Shanghai
      DATABASE_URL: postgres://cecs:${POSTGRES_PASSWORD:-cecs_dev_2026}@db:5432/cecs
      JWT_SECRET: ${JWT_SECRET:?请在 .env 设置 JWT_SECRET（长随机串）}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-Admin#2026}
      # 生产不需要跨域（客户端从服务器加载页面，同源）：留空 = 不放行任何跨域来源
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # 学生、教师只能用客户端登录；临时要在浏览器里验收时设 false
      DESKTOP_ONLY: ${DESKTOP_ONLY:-}
      TRUST_PROXY: "true"
      PORT: 8787
      # 加密存储厂商 API Key 的密钥（P2 模型网关）；未设置时由 JWT_SECRET 派生
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
      # 仅首次启动时导入为默认模型档案，之后在管理端「AI 与语音服务」维护
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_EXTRA_BODY: ${LLM_EXTRA_BODY:-}
      TTS_API_KEY: ${TTS_API_KEY:-}
      TTS_RESOURCE_ID: ${TTS_RESOURCE_ID:-seed-tts-2.0}
      TTS_SPEAKER: ${TTS_SPEAKER:-zh_female_vv_uranus_bigtts}
      TTS_SPEAKER_MALE: ${TTS_SPEAKER_MALE:-zh_male_dayi_uranus_bigtts}
      ASR_RESOURCE_ID: ${ASR_RESOURCE_ID:-volc.seedasr.sauc.duration}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - cecs_uploads:/app/apps/api/uploads
      # 备份文件单独一个卷：重建、更新 api 容器不会丢
      - cecs_backups:/app/apps/api/backups

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    restart: unless-stopped
    ports:
      # 只给本机的宿主机 nginx（HTTPS）转发用，不直接对外
      - "127.0.0.1:8081:80"
    depends_on:
      - api
    volumes:
      # 客户端更新源：发版时把安装包、latest.yml、blockmap 放进宿主机 ./updates（见 docs/DEPLOY.md）
      - ./updates:/usr/share/nginx/updates:ro

volumes:
  cecs_pg_data:
  cecs_uploads:
  cecs_backups:
