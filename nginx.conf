# 单入口同域反代：前端静态 + API + 上传资源 + 客户端更新源。
# 客户端外壳从这里加载页面（D-83），页面和接口同源，不需要跨域。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;

    # 前面还有一层宿主机 nginx 负责 HTTPS（见 docs/DEPLOY.md）：真实来源 IP 从它给的 X-Real-IP 取，
    # 否则所有人都是 docker 网关地址，登录按 IP 限流会把全体用户算成一个人。只信任本机和 docker 内网发来的这个头
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Real-IP;

    # 后端 API（含 SSE 流式对话——必须关闭缓冲，否则 AI 回复会攒满才吐出）
    location /v1/ {
        proxy_pass http://api:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;  # 用上面取到的真实来源 IP 覆盖而非追加，防止客户端伪造 IP 绕过登录限流
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 上传资源（商品图 / 语音 / TTS 缓存）
    location /uploads/ {
        proxy_pass http://api:8787;
        proxy_set_header Host $host;
        proxy_buffering off;
    }

    # 内置商品库图片（随 API 镜像发布）
    location /library/ {
        proxy_pass http://api:8787;
        proxy_set_header Host $host;
    }

    # 健康检查
    location = /health {
        proxy_pass http://api:8787;
    }

    # 客户端自动更新源：latest.yml + 安装包 + blockmap + policy.json（宿主机 ./updates 目录挂进来，发版时往里放文件）
    location /updates/ {
        root /usr/share/nginx;
        autoindex off;
        # 版本描述每次都要拿最新的；安装包文件名带版本号，可以缓存
        location ~ \.(yml|json)$ {
            add_header Cache-Control "no-cache";
        }
    }

    # 带哈希的前端资源：内容变了文件名就变，放心长期缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 入口页每次都问服务器：前端一发布，客户端下次打开就是新版
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA 前端（history 路由回退 index.html）
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;
}
